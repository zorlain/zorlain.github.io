<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "비밀번호 생성기",
  "url": "https://zorlain.github.io/password-generator/",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" },
  "description": "조건에 맞는 랜덤 비밀번호를 브라우저에서 바로 만드는 무료 온라인 도구입니다."
}

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23000000'/%3E%3Crect x='6' y='11' width='12' height='9' rx='2' fill='white'/%3E%3Cpath d='M8 11 V8 a4 4 0 0 1 8 0 v3' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <a class="topbar-back" href="https://zorlain.github.io/" aria-label="toolbox로 돌아가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 6 L9 12 L15 18" />
      </svg>
    </a>
    <div class="brand"><span>비밀번호 생성기</span></div>
  </div>
  <div class="topbar-actions">
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="다크/라이트 모드 전환"></button>
  </div>
</header>

<div class="page">

  <div class="pw-hero">
    <h1>비밀번호 생성기</h1>
    <p>다양한 문자를 조합한 안전하고 고유한 비밀번호를 무료로 생성하세요.</p>
  </div>

  <div class="card">
    <div class="pw-display" id="pw-display">
      <span class="pw-text" id="pw-text"></span>
      <span class="pw-strength-badge" id="pw-strength-badge"></span>
      <button type="button" class="pw-icon-btn" id="pw-refresh-btn" aria-label="다시 생성">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2" />
          <path d="M18 3v4h-4M6 21v-4h4" />
        </svg>
      </button>
      <button type="button" class="pw-copy-btn" id="pw-copy-btn">복사</button>
    </div>
  </div>

  <div class="card">
    <h2>옵션</h2>
    <div class="field-group">
      <label for="opt-length">길이: <span id="opt-length-label">16자</span></label>
      <div class="stepper-row">
        <button type="button" class="stepper-btn" id="len-minus" aria-label="길이 줄이기">−</button>
        <input type="range" id="opt-length" min="4" max="64" step="1" value="16" class="range-input" />
        <button type="button" class="stepper-btn" id="len-plus" aria-label="길이 늘리기">+</button>
      </div>
    </div>
    <div class="checkbox-grid">
      <label class="check-row"><input type="checkbox" id="opt-upper" checked /><span>대문자 (A-Z)</span></label>
      <label class="check-row"><input type="checkbox" id="opt-lower" checked /><span>소문자 (a-z)</span></label>
      <label class="check-row"><input type="checkbox" id="opt-digits" checked /><span>숫자 (0-9)</span></label>
      <label class="check-row"><input type="checkbox" id="opt-symbols" checked /><span>특수문자 (!@#$…)</span></label>
      <label class="check-row"><input type="checkbox" id="opt-exclude-ambiguous" /><span>헷갈리는 문자 제외 (0,O,1,l,I)</span></label>
    </div>
  </div>

  <div class="card">
    <h2>여러 개 한번에 생성</h2>
    <div class="field-group">
      <label for="opt-count">생성 개수: <span id="opt-count-label">5개</span></label>
      <input type="range" id="opt-count" min="2" max="20" step="1" value="5" class="range-input" />
    </div>
    <button class="calc-btn secondary-btn" id="pw-generate-many-btn">여러 개 생성</button>
    <div class="pw-list" id="pw-list"></div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
