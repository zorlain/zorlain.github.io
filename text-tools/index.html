</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <a class="topbar-back" href="https://zorlain.github.io/" aria-label="toolbox로 돌아가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 6 L9 12 L15 18" />
      </svg>
    </a>
    <div class="brand"><span>텍스트 도구 모음</span></div>
  </div>
  <div class="topbar-actions">
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="다크/라이트 모드 전환"></button>
  </div>
</header>

<div class="page">

  <section class="txt-hero">
    <h1>텍스트 도구 모음</h1>
    <p class="tool-hub-desc">글자수 세기, 대소문자 변환, 정렬, URL 인코딩을 한 곳에서 쓰세요. 입력한 글은 서버로 전송되지 않습니다.</p>
  </section>

  <nav class="txt-tabs" id="txt-tabs" role="tablist" aria-label="텍스트 도구">
    <button type="button" class="txt-tab active" role="tab" data-tab="count">글자수 세기</button>
    <button type="button" class="txt-tab" role="tab" data-tab="case">대소문자·공백</button>
    <button type="button" class="txt-tab" role="tab" data-tab="sort">정렬·뒤집기</button>
    <button type="button" class="txt-tab" role="tab" data-tab="url">URL 인코딩</button>
    <button type="button" class="txt-tab" role="tab" data-tab="symbols">특수문자</button>
  </nav>

  <div class="page-inner" id="tabs">

  <!-- 탭 1: 글자수 세기 -->
  <section class="tab-panel" data-tab-panel="count">
    <div class="field-group">
      <div class="field-input-wrap">
        <textarea id="count-input" rows="9" placeholder="여기에 텍스트를 입력하거나 붙여넣으세요"></textarea>
      </div>
    </div>
    <div class="stat-grid">
      <div class="result-stat highlight">
        <div class="result-stat-label">공백 포함</div>
        <div class="result-stat-value" id="count-with-space">0자</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-label">공백 제외</div>
        <div class="result-stat-value" id="count-no-space">0자</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-label">단어 수</div>
        <div class="result-stat-value" id="count-words">0개</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-label">줄 수</div>
        <div class="result-stat-value" id="count-lines">0줄</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-label">바이트 (UTF-8)</div>
        <div class="result-stat-value" id="count-bytes">0B</div>
      </div>
    </div>
  </section>

  <!-- 탭 2: 대소문자·공백 -->
  <section class="tab-panel" data-tab-panel="case" hidden>
    <div class="tool-btn-grid">
      <button type="button" class="secondary-btn" data-action="upper">대문자로</button>
      <button type="button" class="secondary-btn" data-action="lower">소문자로</button>
      <button type="button" class="secondary-btn" data-action="title">Title Case</button>
      <button type="button" class="secondary-btn" data-action="trim">각 줄 앞뒤 공백 제거</button>
      <button type="button" class="secondary-btn" data-action="dedupe-lines">중복 줄 제거</button>
      <button type="button" class="secondary-btn" data-action="remove-empty">빈 줄 제거</button>
      <button type="button" class="secondary-btn" data-action="collapse-spaces">연속 공백 하나로</button>
      <button type="button" class="secondary-btn" data-action="join-lines">한 줄로 합치기</button>
    </div>
    <div class="compare-cols">
      <div class="field-group">
        <label for="case-input">원본</label>
        <div class="field-input-wrap">
          <textarea id="case-input" rows="9" placeholder="여기에 텍스트를 입력하거나 붙여넣으세요"></textarea>
        </div>
      </div>
      <div class="field-group">
        <label for="case-output">결과</label>
        <div class="field-input-wrap">
          <textarea id="case-output" rows="9" readonly placeholder="위에서 변환 방법을 누르면 결과가 나옵니다"></textarea>
        </div>
      </div>
    </div>
    <div class="compare-actions">
      <button class="calc-btn" id="case-copy-btn">결과 복사</button>
      <button type="button" class="secondary-btn" id="case-chain-btn">결과를 원본으로</button>
    </div>
  </section>

  <!-- 탭 3: 텍스트 정렬·뒤집기 -->
  <section class="tab-panel" data-tab-panel="sort" hidden>
    <div class="tool-btn-grid">
      <button type="button" class="secondary-btn" data-action="asc">가나다순 정렬</button>
      <button type="button" class="secondary-btn" data-action="desc">역순 정렬</button>
      <button type="button" class="secondary-btn" data-action="reverse">줄 순서 뒤집기</button>
      <button type="button" class="secondary-btn" data-action="shuffle">무작위 섞기</button>
    </div>
    <div class="compare-cols">
      <div class="field-group">
        <label for="sort-input">원본 (한 줄에 하나씩)</label>
        <div class="field-input-wrap">
          <textarea id="sort-input" rows="9" placeholder="한 줄에 하나씩 입력하세요"></textarea>
        </div>
      </div>
      <div class="field-group">
        <label for="sort-output">결과</label>
        <div class="field-input-wrap">
          <textarea id="sort-output" rows="9" readonly placeholder="위에서 정렬 방법을 누르면 결과가 나옵니다"></textarea>
        </div>
      </div>
    </div>
    <div class="compare-actions">
      <button class="calc-btn" id="sort-copy-btn">결과 복사</button>
      <button type="button" class="secondary-btn" id="sort-chain-btn">결과를 원본으로</button>
    </div>
  </section>

  <!-- 탭 4: URL 인코딩·디코딩 -->
  <section class="tab-panel" data-tab-panel="url" hidden>
    <div class="tool-btn-grid">
      <button type="button" class="secondary-btn" id="url-encode-btn">인코딩 →</button>
      <button type="button" class="secondary-btn" id="url-decode-btn">← 디코딩</button>
    </div>
    <p class="calc-error-msg" id="url-error" hidden></p>
    <div class="compare-cols">
      <div class="field-group">
        <label for="url-input">원본</label>
        <div class="field-input-wrap">
          <textarea id="url-input" rows="7" placeholder="https://example.com/검색?q=안녕하세요"></textarea>
        </div>
      </div>
      <div class="field-group">
        <label for="url-output">결과</label>
        <div class="field-input-wrap">
          <textarea id="url-output" rows="7" readonly placeholder="여기에 결과가 표시됩니다"></textarea>
        </div>
      </div>
    </div>
    <div class="compare-actions">
      <button class="calc-btn" id="url-copy-btn">결과 복사</button>
    </div>
  </section>

  <!-- 탭 5: 특수문자 -->
  <section class="tab-panel" data-tab-panel="symbols" hidden>
    <p class="card-desc-short">클릭하면 바로 복사됩니다.</p>
    <div id="symbol-groups"></div>
  </section>

  </div>

</div>

<script src="js/app.js?v=20261123"></script>
</body>
</html>
